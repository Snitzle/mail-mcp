[package]
name = "mail-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Local multi-account email MCP server (Outlook/Hotmail and Gmail over IMAP/SMTP)"
publish = false

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ego-tree = "0.11.1"
futures = "0.3.34"
getrandom = "0.4.3"
keyring = "4.2.0"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls", "ring", "webpki-roots"] }
mail-builder = "2.0.1"
mail-parser = { version = "1.0.1", features = ["full_encoding"] }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io", "elicitation", "schemars"] }
rpassword = "7.5.5"
rustix = { version = "1.1.6", features = ["process", "fs", "thread"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "net", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "1.2.1"
ureq = { version = "3.5.1", features = ["json"] }
url = "2.5.8"
webpki-roots = "1.0.12"
zeroize = "1.9.1"

[dev-dependencies]
rmcp = { version = "3.9.0", features = ["client"] }
tempfile = "3.27.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
